services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gama-backend-api
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "${SYMFONY_HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    depends_on:
      symfony-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: >
      bash -lc "if [ ! -d vendor ]; then composer install; fi && php -S 0.0.0.0:8080 -t public"

  frontend:
    image: node:${FRONTEND_NODE_VERSION:-24.14.0}
    container_name: gama-frontend
    working_dir: /app
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${VITE_DEV_PORT:-5173}:5173"
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: ${VITE_DEV_PORT:-5173}
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8080}
      VITE_USE_POLLING: "1"
    depends_on:
      backend:
        condition: service_started
    entrypoint: ["/bin/bash", "/app/docker/frontend-entrypoint.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  frontend-tools:
    image: node:${FRONTEND_NODE_VERSION:-24.14.0}
    working_dir: /app
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8080}
      VITE_USE_POLLING: "1"
      CI: "1"
    entrypoint: ["/bin/bash", "/app/docker/frontend-entrypoint.sh"]
    command: ["npm", "--version"]
    profiles: ["tools"]

  backend-tools:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    user: "${HOST_UID:-501}:${HOST_GID:-20}"
    entrypoint: ["composer"]
    command: ["--version"]
    profiles: ["tools"]

  symfony-db:
    image: postgres:${SYMFONY_DB_VERSION:-16}-alpine
    container_name: gama-symfony-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYMFONY_DB_NAME:-gama_site}
      POSTGRES_USER: ${SYMFONY_DB_USER:-gama_admin}
      POSTGRES_PASSWORD: ${SYMFONY_DB_PASSWORD:-gama_pass}
    ports:
      - "${SYMFONY_DB_PORT:-5433}:5432"
    volumes:
      - symfony-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${SYMFONY_DB_NAME:-gama_site}", "-U", "${SYMFONY_DB_USER:-gama_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gama-mailhog
    restart: unless-stopped
    ports:
      - "${SYMFONY_MAILHOG_HTTP_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  symfony-db-data:
  frontend-node-modules:
