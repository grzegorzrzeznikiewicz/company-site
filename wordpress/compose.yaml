name: gama-wordpress

services:
  db:
    image: mariadb:10.11.18-jammy
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - gama-wordpress-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=$$MARIADB_USER --password=$$MARIADB_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  uploads-init:
    image: wordpress:7.1.0-php8.4-apache
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "mkdir -p /uploads && chown 33:33 /uploads && chmod 0775 /uploads"
    volumes:
      - gama-wordpress-uploads:/uploads

  wordpress:
    image: wordpress:7.1.0-php8.4-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WP_HTTP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      GAMA_CONTACT_RECIPIENT: ${GAMA_CONTACT_RECIPIENT:-founders@gama-software.com}
      GAMA_CONTACT_SENDER: ${GAMA_CONTACT_SENDER:-no-reply@gama-software.com}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'local');
        define('GAMA_CONTACT_RECIPIENT', getenv('GAMA_CONTACT_RECIPIENT') ?: '');
        define('GAMA_CONTACT_SENDER', getenv('GAMA_CONTACT_SENDER') ?: '');
    volumes:
      - gama-wordpress-core:/var/www/html
      - gama-wordpress-uploads:/var/www/html/wp-content/uploads
      - ./theme/gama-software:/var/www/html/wp-content/themes/gama-software:ro
      - ./plugins/gama-local-mailpit:/var/www/html/wp-content/plugins/gama-local-mailpit:ro
      - ./plugins/gama-contact:/var/www/html/wp-content/plugins/gama-contact:ro
      - ./plugins/gama-seo:/var/www/html/wp-content/plugins/gama-seo:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body = @file_get_contents(\"http://127.0.0.1/wp-login.php\"); $$status = $$http_response_header[0] ?? \"\"; exit(str_starts_with($$status, \"HTTP/\") && !str_contains($$status, \" 4\") && !str_contains($$status, \" 5\") ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  wp:
    image: wordpress:cli-2.12.0-php8.4
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WP_HOME: ${WP_HOME}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      GAMA_CONTACT_RECIPIENT: ${GAMA_CONTACT_RECIPIENT:-founders@gama-software.com}
      GAMA_CONTACT_SENDER: ${GAMA_CONTACT_SENDER:-no-reply@gama-software.com}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
    volumes:
      - gama-wordpress-core:/var/www/html
      - gama-wordpress-uploads:/var/www/html/wp-content/uploads
      - ./theme/gama-software:/var/www/html/wp-content/themes/gama-software:ro
      - ./plugins/gama-local-mailpit:/var/www/html/wp-content/plugins/gama-local-mailpit:ro
      - ./plugins/gama-contact:/var/www/html/wp-content/plugins/gama-contact:ro
      - ./plugins/gama-seo:/var/www/html/wp-content/plugins/gama-seo:ro
      - ./bin/bootstrap:/usr/local/bin/gama-wordpress-bootstrap:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/gama-wordpress-bootstrap"]
    depends_on:
      wordpress:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  gama-wordpress-core:
  gama-wordpress-db-data:
  gama-wordpress-uploads:
