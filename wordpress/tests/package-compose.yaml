services:
  db:
    image: mariadb:10.11.18-jammy
    environment:
      MARIADB_DATABASE: wordpress_package_test
      MARIADB_USER: wordpress_package_test
      MARIADB_PASSWORD: wordpress-package-test-only
      MARIADB_ROOT_PASSWORD: wordpress-package-root-test-only
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=$$MARIADB_USER --password=$$MARIADB_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  wordpress:
    image: wordpress:7.1.0-php8.4-apache
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_package_test
      WORDPRESS_DB_USER: wordpress_package_test
      WORDPRESS_DB_PASSWORD: wordpress-package-test-only
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        @ini_set('display_errors', '0');
        error_reporting(E_ALL);
    volumes:
      - core:/var/www/html
      - uploads:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body = @file_get_contents(\"http://127.0.0.1/wp-login.php\"); $$status = $$http_response_header[0] ?? \"\"; exit(str_starts_with($$status, \"HTTP/\") && !str_contains($$status, \" 4\") && !str_contains($$status, \" 5\") ? 0 : 1);'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  uploads-init:
    image: wordpress:7.1.0-php8.4-apache
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "mkdir -p /uploads && chown 33:33 /uploads && chmod 0775 /uploads"
    volumes:
      - uploads:/uploads

  wp:
    image: wordpress:cli-2.12.0-php8.4
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_package_test
      WORDPRESS_DB_USER: wordpress_package_test
      WORDPRESS_DB_PASSWORD: wordpress-package-test-only
    volumes:
      - core:/var/www/html
      - uploads:/var/www/html/wp-content/uploads
      - type: bind
        source: ${PACKAGE_ZIP:?PACKAGE_ZIP must identify the tested ZIP}
        target: /package/gama-contact.zip
        read_only: true
    entrypoint: ["wp", "--path=/var/www/html"]
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  core:
  db-data:
  uploads:
