name: CI Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-quality:
    name: Backend Quality (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, phpstan, phpmd, php-cs-fixer
          coverage: none

      - name: Prepare backend env
        shell: bash
        env:
          APP_SECRET: ${{ secrets.PROD_COMPANY_API_APP_SECRET }}
          COMPANY_DB_PASSWORD: ${{ secrets.PROD_COMPANY_DB_PASSWORD }}
          MAILER_DSN: ${{ secrets.PROD_MAILER_DSN }}
          CONTACT_RECIPIENT: ${{ secrets.PROD_CONTACT_RECIPIENT }}
          CONTACT_SENDER: ${{ secrets.PROD_CONTACT_SENDER }}
          ADMIN_PASSWORD_HASH: ${{ secrets.PROD_ADMIN_PASSWORD_HASH }}
        run: |
          : "${APP_SECRET:?Missing GitHub secret PROD_COMPANY_API_APP_SECRET}"
          : "${COMPANY_DB_PASSWORD:?Missing GitHub secret PROD_COMPANY_DB_PASSWORD}"
          : "${MAILER_DSN:?Missing GitHub secret PROD_MAILER_DSN}"
          : "${CONTACT_RECIPIENT:?Missing GitHub secret PROD_CONTACT_RECIPIENT}"
          : "${CONTACT_SENDER:?Missing GitHub secret PROD_CONTACT_SENDER}"
          : "${ADMIN_PASSWORD_HASH:?Missing GitHub secret PROD_ADMIN_PASSWORD_HASH}"

          ENCODED_DB_PASSWORD="$(RAW_DB_PASSWORD="$COMPANY_DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RAW_DB_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql://gama_admin:${ENCODED_DB_PASSWORD}@symfony-db:5432/gama_site?serverVersion=16&charset=utf8"
          DEFAULT_URI="http://localhost"
          CORS_ALLOW_ORIGIN='^(https?://(localhost|127\.0\.0\.1)(:[0-9]+)?|https?://(api\.)?company\.test(:[0-9]+)?|https://(www\.)?gama-software\.com)$'
          ADMIN_USERNAME="admin"

          cat > .env <<EOF
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=${APP_SECRET}
          DATABASE_URL=${DATABASE_URL}
          MAILER_DSN=${MAILER_DSN}
          DEFAULT_URI=${DEFAULT_URI}
          CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
          CONTACT_RECIPIENT=${CONTACT_RECIPIENT}
          CONTACT_SENDER=${CONTACT_SENDER}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
          EOF

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP coding standards (PSR-12 + Symfony)
        run: php-cs-fixer fix --dry-run --diff --using-cache=no --config=.php-cs-fixer.dist.php

      - name: Static analysis (PHPStan)
        run: phpstan analyse src --no-progress --level=5

      - name: Mess detector (PHPMD)
        run: phpmd src text phpmd.xml

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare backend env
        shell: bash
        env:
          APP_SECRET: ${{ secrets.PROD_COMPANY_API_APP_SECRET }}
          COMPANY_DB_PASSWORD: ${{ secrets.PROD_COMPANY_DB_PASSWORD }}
          MAILER_DSN: ${{ secrets.PROD_MAILER_DSN }}
          CONTACT_RECIPIENT: ${{ secrets.PROD_CONTACT_RECIPIENT }}
          CONTACT_SENDER: ${{ secrets.PROD_CONTACT_SENDER }}
          ADMIN_PASSWORD_HASH: ${{ secrets.PROD_ADMIN_PASSWORD_HASH }}
        run: |
          : "${APP_SECRET:?Missing GitHub secret PROD_COMPANY_API_APP_SECRET}"
          : "${COMPANY_DB_PASSWORD:?Missing GitHub secret PROD_COMPANY_DB_PASSWORD}"
          : "${MAILER_DSN:?Missing GitHub secret PROD_MAILER_DSN}"
          : "${CONTACT_RECIPIENT:?Missing GitHub secret PROD_CONTACT_RECIPIENT}"
          : "${CONTACT_SENDER:?Missing GitHub secret PROD_CONTACT_SENDER}"
          : "${ADMIN_PASSWORD_HASH:?Missing GitHub secret PROD_ADMIN_PASSWORD_HASH}"

          ENCODED_DB_PASSWORD="$(RAW_DB_PASSWORD="$COMPANY_DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RAW_DB_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql://gama_admin:${ENCODED_DB_PASSWORD}@symfony-db:5432/gama_site?serverVersion=16&charset=utf8"
          DEFAULT_URI="http://localhost"
          CORS_ALLOW_ORIGIN='^(https?://(localhost|127\.0\.0\.1)(:[0-9]+)?|https?://(api\.)?company\.test(:[0-9]+)?|https://(www\.)?gama-software\.com)$'
          ADMIN_USERNAME="admin"

          cat > .env <<EOF
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=${APP_SECRET}
          DATABASE_URL=${DATABASE_URL}
          MAILER_DSN=${MAILER_DSN}
          DEFAULT_URI=${DEFAULT_URI}
          CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
          CONTACT_RECIPIENT=${CONTACT_RECIPIENT}
          CONTACT_SENDER=${CONTACT_SENDER}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
          EOF

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Detect backend tests
        id: detect_backend_tests
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Brak testow backendowych (unit/integracyjne) w backend/tests."
          fi

      - name: Run backend tests
        if: steps.detect_backend_tests.outputs.has_tests == 'true'
        shell: bash
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "::notice::Wykryto pliki testowe, ale phpunit nie jest skonfigurowany."
          fi

  frontend-quality-tests:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run build

      - name: Detect frontend test scripts
        id: detect_frontend_tests
        shell: bash
        run: |
          node -e "const p=require('./package.json');const s=p.scripts||{};const hasUnit=Boolean(s.test||s['test:unit']||s.unit);const hasE2E=Boolean(s.e2e||s['test:e2e']);console.log('has_unit_tests=' + hasUnit);console.log('has_e2e_tests=' + hasE2E);" >> "$GITHUB_OUTPUT"
          if [ "$(grep '^has_unit_tests=' "$GITHUB_OUTPUT" | cut -d= -f2)" != "true" ]; then
            echo "::notice::Brak skonfigurowanych testow frontendowych unit/jest."
          fi
          if [ "$(grep '^has_e2e_tests=' "$GITHUB_OUTPUT" | cut -d= -f2)" != "true" ]; then
            echo "::notice::Brak skonfigurowanych testow frontendowych e2e."
          fi

      - name: Run frontend unit tests
        if: steps.detect_frontend_tests.outputs.has_unit_tests == 'true'
        run: |
          if npm run | grep -q "test:unit"; then
            npm run test:unit
          elif npm run | grep -q " test"; then
            npm test
          elif npm run | grep -q " unit"; then
            npm run unit
          fi

      - name: Run frontend e2e tests
        if: steps.detect_frontend_tests.outputs.has_e2e_tests == 'true'
        run: |
          if npm run | grep -q "test:e2e"; then
            npm run test:e2e
          elif npm run | grep -q " e2e"; then
            npm run e2e
          fi
