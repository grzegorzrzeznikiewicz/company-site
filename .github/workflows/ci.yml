name: CI Quality Checks

env:
  FRONTEND_NODE_VERSION: '24.14.0'

on:
  pull_request:
  push:

jobs:
  backend-quality:
    name: Backend Quality (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare backend env
        shell: bash
        env:
          APP_SECRET: ${{ secrets.PROD_COMPANY_API_APP_SECRET }}
          COMPANY_DB_PASSWORD: ${{ secrets.PROD_COMPANY_DB_PASSWORD }}
          MAILER_DSN: ${{ secrets.PROD_MAILER_DSN }}
          CONTACT_RECIPIENT: ${{ secrets.PROD_CONTACT_RECIPIENT }}
          CONTACT_SENDER: ${{ secrets.PROD_CONTACT_SENDER }}
          ADMIN_PASSWORD_HASH: ${{ secrets.PROD_ADMIN_PASSWORD_HASH }}
        run: |
          : "${APP_SECRET:?Missing GitHub secret PROD_COMPANY_API_APP_SECRET}"
          : "${COMPANY_DB_PASSWORD:?Missing GitHub secret PROD_COMPANY_DB_PASSWORD}"
          : "${MAILER_DSN:?Missing GitHub secret PROD_MAILER_DSN}"
          : "${CONTACT_RECIPIENT:?Missing GitHub secret PROD_CONTACT_RECIPIENT}"
          : "${CONTACT_SENDER:?Missing GitHub secret PROD_CONTACT_SENDER}"
          : "${ADMIN_PASSWORD_HASH:?Missing GitHub secret PROD_ADMIN_PASSWORD_HASH}"

          ENCODED_DB_PASSWORD="$(RAW_DB_PASSWORD="$COMPANY_DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RAW_DB_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql://gama_admin:${ENCODED_DB_PASSWORD}@symfony-db:5432/gama_site?serverVersion=16&charset=utf8"
          DEFAULT_URI="http://localhost"
          CORS_ALLOW_ORIGIN='^(https?://(localhost|127\.0\.0\.1)(:[0-9]+)?|https?://(api\.)?company\.test(:[0-9]+)?|https://(www\.)?gama-software\.com)$'
          ADMIN_USERNAME="admin"

          cat > .env <<EOF
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=${APP_SECRET}
          DATABASE_URL=${DATABASE_URL}
          MAILER_DSN=${MAILER_DSN}
          DEFAULT_URI=${DEFAULT_URI}
          CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
          CONTACT_RECIPIENT=${CONTACT_RECIPIENT}
          CONTACT_SENDER=${CONTACT_SENDER}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
          EOF

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP coding standards (PSR-12 + Symfony)
        run: composer lint:cs

      - name: Static analysis (PHPStan)
        run: composer lint:phpstan

      - name: Mess detector (PHPMD)
        run: composer lint:md

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare backend env
        shell: bash
        env:
          APP_SECRET: ${{ secrets.PROD_COMPANY_API_APP_SECRET }}
          COMPANY_DB_PASSWORD: ${{ secrets.PROD_COMPANY_DB_PASSWORD }}
          MAILER_DSN: ${{ secrets.PROD_MAILER_DSN }}
          CONTACT_RECIPIENT: ${{ secrets.PROD_CONTACT_RECIPIENT }}
          CONTACT_SENDER: ${{ secrets.PROD_CONTACT_SENDER }}
          ADMIN_PASSWORD_HASH: ${{ secrets.PROD_ADMIN_PASSWORD_HASH }}
        run: |
          : "${APP_SECRET:?Missing GitHub secret PROD_COMPANY_API_APP_SECRET}"
          : "${COMPANY_DB_PASSWORD:?Missing GitHub secret PROD_COMPANY_DB_PASSWORD}"
          : "${MAILER_DSN:?Missing GitHub secret PROD_MAILER_DSN}"
          : "${CONTACT_RECIPIENT:?Missing GitHub secret PROD_CONTACT_RECIPIENT}"
          : "${CONTACT_SENDER:?Missing GitHub secret PROD_CONTACT_SENDER}"
          : "${ADMIN_PASSWORD_HASH:?Missing GitHub secret PROD_ADMIN_PASSWORD_HASH}"

          ENCODED_DB_PASSWORD="$(RAW_DB_PASSWORD="$COMPANY_DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RAW_DB_PASSWORD"], safe=""))')"
          DATABASE_URL="postgresql://gama_admin:${ENCODED_DB_PASSWORD}@symfony-db:5432/gama_site?serverVersion=16&charset=utf8"
          DEFAULT_URI="http://localhost"
          CORS_ALLOW_ORIGIN='^(https?://(localhost|127\.0\.0\.1)(:[0-9]+)?|https?://(api\.)?company\.test(:[0-9]+)?|https://(www\.)?gama-software\.com)$'
          ADMIN_USERNAME="admin"

          cat > .env <<EOF
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=${APP_SECRET}
          DATABASE_URL=${DATABASE_URL}
          MAILER_DSN=${MAILER_DSN}
          DEFAULT_URI=${DEFAULT_URI}
          CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN}
          CONTACT_RECIPIENT=${CONTACT_RECIPIENT}
          CONTACT_SENDER=${CONTACT_SENDER}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
          EOF

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        run: composer test

  frontend-quality-tests:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build
