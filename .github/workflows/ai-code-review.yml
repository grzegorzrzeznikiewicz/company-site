name: AI Code Review

# Every ready owner PR to main is reviewed by the Open Mercato `om-auto-review-pr`
# skill (vendored in .claude/skills, rules in CODE_REVIEW.md) running as the
# Claude GitHub App. APPROVED on the exact head: the owner's solo AI report is
# recorded and squash auto-merge is enabled (the four WordPress quality gates
# still have to pass, then production deploys). CHANGES_REQUESTED: the blocking
# report is recorded and nothing merges. See docs/agent-workflows/ai-code-review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review (Open Mercato)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'grzegorzrzeznikiewicz'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Withdraw auto-merge armed for an earlier head
        env:
          GH_TOKEN: ${{ secrets.GAMA_AUTOMERGE_TOKEN }}
        run: |
          armed="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = true ]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi

      - name: Checkout reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review with om-auto-review-pr
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /om-auto-review-pr ${{ github.event.pull_request.number }}

            Run context for this unattended CI run (repository ${{ github.repository }}):
            - Review head ${{ github.event.pull_request.head.sha }} only. You are a reviewer here: never push,
              never merge, never edit the PR branch, never change labels (labels are disabled in config).
            - Apply CODE_REVIEW.md from the repository root and AGENTS.md. Remember every approval is a
              production release: a merge to main deploys automatically.
            - Finish by submitting exactly one review on this head with `gh pr review` — `--approve` or
              `--request-changes` — following the om-code-review verdict rule. Do not wait for CI.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Skill,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git:*),Bash(python3 -W error -m unittest:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(git push:*),Bash(git commit:*)"

      - name: Record verdict as the owner's solo AI report
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GAMA_AUTOMERGE_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          result="$(python3 -W error -m wordpress.release.ai_review_gate)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "AI review verdict for ${HEAD_SHA}: ${result}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable squash auto-merge for the approved head
        if: steps.gate.outputs.result == 'approved'
        env:
          GH_TOKEN: ${{ secrets.GAMA_AUTOMERGE_TOKEN }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"

      - name: Keep blocked PR unmerged
        if: steps.gate.outputs.result == 'changes-requested'
        run: |
          echo "AI review requested changes on ${HEAD_SHA}; auto-merge stays off." >> "$GITHUB_STEP_SUMMARY"
          exit 1
