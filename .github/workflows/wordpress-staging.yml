name: WordPress Staging Deployment

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full commit SHA that passed WordPress Quality Gates
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordpress-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable WordPress image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - name: Validate requested revision
        env:
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
        shell: bash
        run: '[[ "$INPUT_GIT_SHA" =~ ^[a-f0-9]{40}$ ]]'

      - name: Checkout requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Require successful WordPress quality gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
        shell: bash
        run: |
          successful_runs="$(gh run list --workflow 'WordPress Quality Gates' --commit "$INPUT_GIT_SHA" --status success --json conclusion --jq 'length')"
          [[ "$successful_runs" -ge 1 ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: metadata
        env:
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gama-wordpress:sha-$INPUT_GIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: wordpress/runtime/Dockerfile
          push: true
          build-args: GAMA_GIT_SHA=${{ inputs.git_sha }}
          tags: ${{ steps.metadata.outputs.tag }}

      - name: Publish immutable reference
        id: reference
        shell: bash
        run: echo "image=${{ steps.metadata.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact image to staging
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: wordpress-staging
    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_sha }}

      - name: Encode reviewed Compose definitions
        id: compose
        shell: bash
        run: |
          echo "base=$(base64 -w0 wordpress/deploy/compose.yaml)" >> "$GITHUB_OUTPUT"
          echo "staging=$(base64 -w0 wordpress/deploy/staging.override.yaml)" >> "$GITHUB_OUTPUT"

      - name: Deploy through isolated staging namespace
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          WORDPRESS_IMAGE: ${{ needs.build.outputs.image }}
          COMPOSE_BASE: ${{ steps.compose.outputs.base }}
          COMPOSE_STAGING: ${{ steps.compose.outputs.staging }}
          GHCR_USERNAME: ${{ secrets.STAGING_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          envs: WORDPRESS_IMAGE,COMPOSE_BASE,COMPOSE_STAGING,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            target=/srv/gama-wordpress-staging
            test -f "$target/.env"
            install -d -m 0750 "$target"
            printf '%s' "$COMPOSE_BASE" | base64 -d > "$target/compose.yaml.next"
            printf '%s' "$COMPOSE_STAGING" | base64 -d > "$target/staging.override.yaml.next"
            mv "$target/compose.yaml.next" "$target/compose.yaml"
            mv "$target/staging.override.yaml.next" "$target/staging.override.yaml"
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd "$target"
            export WORDPRESS_IMAGE
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml pull wordpress install bootstrap
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml up -d db mailpit uploads-init
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml stop wordpress || true
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml run --rm --no-deps install
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml up -d --wait wordpress
            sudo --preserve-env=WORDPRESS_IMAGE docker compose --project-name gama-wp-staging --env-file .env --file compose.yaml --file staging.override.yaml run --rm bootstrap

      - name: Verify staging noindex and health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors https://staging.gama-software.com/ > staging.html
          grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+noindex' staging.html

      - name: Record staging-tested immutable release
        env:
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
          WORDPRESS_IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          jq -n \
            --arg git_sha "$INPUT_GIT_SHA" \
            --arg image "$WORDPRESS_IMAGE" \
            --argjson staging_run_id '${{ github.run_id }}' \
            '{git_sha: $git_sha, image: $image, staging_run_id: $staging_run_id}' \
            > staging-release.json

      - name: Publish staging release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-staging-release-${{ inputs.git_sha }}
          path: staging-release.json
          if-no-files-found: error
          retention-days: 30
