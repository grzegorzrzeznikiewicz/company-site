name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'sha-<full 40-character SHA> or main-latest'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wordpress-production
  cancel-in-progress: false
  queue: max
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Checkout trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Guard legacy entry
        id: guard
        env:
          GAMA_DEPLOYMENT_MODE: ${{ vars.GAMA_DEPLOYMENT_MODE }}
        run: python3 -m wordpress.release.legacy guard rollback
  rollback:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    env:
      DEPLOY_GIT_SHA: ${{ needs.guard.outputs.sha }}
    steps:
      - name: Prepare image metadata
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$INPUT_IMAGE_TAG" =~ ^(sha-[a-f0-9]{40}|main-latest)$ ]] || exit 1
          echo "image_tag=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/grzegorzrzeznikiewicz/company-site:$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/grzegorzrzeznikiewicz/company-site-backend:$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Encode legacy host request
        id: request
        env:
          INPUT_IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          request = {'operation_id': 'legacy-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
                     'kind': 'rollback', 'git_sha': os.environ['DEPLOY_GIT_SHA'], 'image_tag': os.environ['INPUT_IMAGE_TAG']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('request=' + base64.b64encode(json.dumps(request).encode()).decode() + '\n')
          PY
      - name: Execute installed serialized legacy transaction
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          RELEASE_REQUEST: ${{ steps.request.outputs.request }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 40m
          envs: RELEASE_REQUEST
          script: |
            set -euo pipefail
            printf '%s' "$RELEASE_REQUEST" | base64 -d | sudo /usr/bin/python3 \
              /srv/gama-wordpress-production/tools/wordpress/bin/production-legacy-release
