name: Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_run:
    workflows:
      - CI Quality Checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      operation:
        description: 'Legacy release or owner-only read-only host inventory (no deployment)'
        type: choice
        default: legacy-release
        options:
          - legacy-release
          - read-only-audit

permissions:
  contents: read

concurrency:
  group: wordpress-production
  cancel-in-progress: false
  queue: max

jobs:
  audit-guard:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'read-only-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
    env:
      INPUT_OPERATION: ${{ inputs.operation }}
      GAMA_DEPLOYMENT_MODE: ${{ vars.GAMA_DEPLOYMENT_MODE }}
    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard read-only audit
        id: guard
        run: python3 -m wordpress.release.server_audit guard

  read-only-audit:
    name: Read-only host inventory (no deployment)
    needs: audit-guard
    if: needs.audit-guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      INPUT_OPERATION: ${{ inputs.operation }}
      GAMA_DEPLOYMENT_MODE: ${{ vars.GAMA_DEPLOYMENT_MODE }}
    steps:
      - name: Checkout exact audit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run pinned read-only audit
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
        run: python3 -m wordpress.release.server_audit run

  guard:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'legacy-release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Checkout trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Guard legacy entry
        id: guard
        env:
          GAMA_DEPLOYMENT_MODE: ${{ vars.GAMA_DEPLOYMENT_MODE }}
        run: python3 -m wordpress.release.legacy guard deploy
  build:
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    needs: guard
    permissions:
      contents: read
      packages: write
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: needs.guard.outputs.allowed == 'true'
    env:
      DEPLOY_GIT_SHA: ${{ needs.guard.outputs.sha }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DEPLOY_GIT_SHA }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          FRONTEND_IMAGE_REPO="ghcr.io/${OWNER_LOWER}/company-site"
          BACKEND_IMAGE_REPO="ghcr.io/${OWNER_LOWER}/company-site-backend"
          IMAGE_TAG="sha-${DEPLOY_GIT_SHA}"
          echo "frontend_image_repo=$FRONTEND_IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "backend_image_repo=$BACKEND_IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: build/Dockerfile
          push: true
          cache-from: type=gha,scope=company-site-frontend
          cache-to: type=gha,mode=max,scope=company-site-frontend
          tags: |
            ${{ steps.image.outputs.frontend_image_repo }}:${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.frontend_image_repo }}:main-latest

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          cache-from: type=gha,scope=company-site-backend
          cache-to: type=gha,mode=max,scope=company-site-backend
          tags: |
            ${{ steps.image.outputs.backend_image_repo }}:${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.backend_image_repo }}:main-latest

  deploy:
    needs: [guard, build]
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_GIT_SHA: ${{ needs.guard.outputs.sha }}
    steps:
      - name: Encode legacy host request
        id: request
        env:
          INPUT_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          request = {'operation_id': 'legacy-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
                     'kind': 'deploy', 'git_sha': os.environ['DEPLOY_GIT_SHA'], 'image_tag': os.environ['INPUT_IMAGE_TAG']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('request=' + base64.b64encode(json.dumps(request).encode()).decode() + '\n')
          PY
      - name: Execute installed serialized legacy transaction
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          RELEASE_REQUEST: ${{ steps.request.outputs.request }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 40m
          envs: RELEASE_REQUEST
          script: |
            set -euo pipefail
            printf '%s' "$RELEASE_REQUEST" | base64 -d | sudo /usr/bin/python3 \
              /srv/gama-wordpress-production/tools/wordpress/bin/production-legacy-release
