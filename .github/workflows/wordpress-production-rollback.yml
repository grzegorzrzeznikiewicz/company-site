name: WordPress Production Rollback
on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Recovery request JSON with retained publication and recovery_authorization; this dispatch fills promotion identity'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wordpress-production
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.guard.outputs.allowed }}
      request: ${{ steps.request.outputs.request }}
    steps:
      - name: Guard recovery entry
        id: guard
        env:
          GAMA_DEPLOYMENT_MODE: ${{ vars.GAMA_DEPLOYMENT_MODE }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          repo = event.get('repository', {})
          allowed = (os.environ.get('GAMA_DEPLOYMENT_MODE') in ('off', 'wordpress')
                     and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                     and os.environ['GITHUB_REF'] == 'refs/heads/main'
                     and os.environ['GITHUB_RUN_ATTEMPT'] == '1'
                     and os.environ['GITHUB_REPOSITORY'] == 'grzegorzrzeznikiewicz/company-site'
                     and repo.get('full_name') == 'grzegorzrzeznikiewicz/company-site'
                     and repo.get('fork') is False and repo.get('default_branch') == 'main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('allowed=' + str(allowed).lower() + '\n')
          PY
      - name: Checkout trusted default-branch tooling
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Display exact requested recovery approval
        if: steps.guard.outputs.allowed == 'true'
        id: request
        env:
          INPUT_REQUEST: ${{ inputs.request }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from wordpress.release.github_source import json_object
          from wordpress.release.host import validate_request
          request = json_object(os.environ['INPUT_REQUEST'].encode())
          auth = request['recovery_authorization']
          auth['promotion_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          auth['promotion_run_attempt'] = int(os.environ['GITHUB_RUN_ATTEMPT'])
          validate_request(request)
          result = subprocess.run(['python3', 'wordpress/bin/production-release', '--recovery-comment'],
                                  input=json.dumps(auth), text=True, capture_output=True, check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Approve wordpress-production-rollback with this exact comment:\n\n```json\n' + result.stdout.strip() + '\n```\n')
          raw = json.dumps(request).encode()
          assert len(raw) <= 1024 * 1024
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('request=' + base64.b64encode(raw).decode() + '\n')
          PY
  recover:
    needs: prepare
    if: needs.prepare.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: wordpress-production-rollback
    permissions: {}
    steps:
      - name: Execute installed serialized recovery transaction
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          RELEASE_REQUEST: ${{ needs.prepare.outputs.request }}
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          command_timeout: 40m
          envs: RELEASE_REQUEST
          script: |
            set -euo pipefail
            printf '%s' "$RELEASE_REQUEST" | base64 -d | sudo /usr/bin/python3 \
              /srv/gama-wordpress-production/tools/wordpress/bin/production-release \
              --config /srv/gama-wordpress-production/control/host-config.json
